<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Registrasi Pelanggan - Agang Property</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#1c1c1c] border border-yellow-600/30 rounded-xl p-8 w-full max-w-lg shadow-2xl">
        <h1 class="text-2xl font-bold text-yellow-500 text-center mb-1">REGISTRASI PELANGGAN</h1>
        <p class="text-gray-400 text-sm text-center mb-6">Buat akun untuk melihat katalog lengkap & jadwal survei</p>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded bg-red-500/20 border border-red-500 text-red-300 text-sm">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Username</label>
                    <input type="text" name="username" required class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700 text-white">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Nama Lengkap</label>
                    <input type="text" name="nama_lengkap" required class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700 text-white">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Email</label>
                    <input type="email" name="email" required class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700 text-white">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">No. Telepon / WhatsApp</label>
                    <input type="text" name="no_telepon" required class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700 text-white">
                </div>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-1">Alamat Domisili</label>
                <textarea name="alamat" rows="2" class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700 text-white"></textarea>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Password</label>
                    <input type="password" name="password" required class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700 text-white">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Konfirmasi Password</label>
                    <input type="password" name="konfirmasi_password" required class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700 text-white">
                </div>
            </div>
            <button type="submit" class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded transition">
                DAFTAR AKUN
            </button>
        </form>

        <p class="text-center text-gray-400 text-sm mt-5">
            Sudah punya akun? <a href="{% url 'login' %}" class="text-yellow-500 hover:underline">Login di sini</a>
        </p>
    </div>
</body>
</html>
