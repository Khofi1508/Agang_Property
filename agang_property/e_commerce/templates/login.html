<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Agang Property</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#1c1c1c] border border-yellow-600/30 rounded-xl p-8 w-full max-w-md shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-yellow-500 tracking-wider">AGANG PROPERTY</h1>
            <p class="text-gray-400 text-sm mt-1">Masuk ke Akun Pengguna atau Panel Admin</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded bg-yellow-500/20 border border-yellow-500 text-yellow-300 text-sm">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm text-gray-300 mb-1">Username</label>
                <input type="text" name="username" required class="w-full p-3 rounded bg-[#2a2a2a] border border-gray-700 focus:border-yellow-500 focus:outline-none text-white">
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-1">Password</label>
                <input type="password" name="password" required class="w-full p-3 rounded bg-[#2a2a2a] border border-gray-700 focus:border-yellow-500 focus:outline-none text-white">
            </div>
            <button type="submit" class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded transition">
                MASUK SEKARANG
            </button>
        </form>

        <p class="text-center text-gray-400 text-sm mt-6">
            Belum punya akun pelanggan? <a href="{% url 'register' %}" class="text-yellow-500 hover:underline">Daftar di sini</a>
        </p>
        <p class="text-center text-gray-500 text-xs mt-2">
            <a href="{% url 'home' %}" class="hover:text-gray-300">← Kembali ke Beranda</a>
        </p>
    </div>
</body>
</html>
