<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Profil Admin - Agang Property</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen flex items-center justify-center p-6">
    <div class="bg-[#1c1c1c] border border-yellow-600/30 rounded-xl p-8 w-full max-w-lg">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-yellow-500">PROFIL & EDIT ADMIN</h1>
            <a href="{% url 'admin_dashboard' %}" class="text-sm text-gray-400 hover:text-white">← Kembali ke Dashboard</a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-4 text-sm">
            {% csrf_token %}
            <div class="flex items-center gap-4 mb-4">
                {% if profile.foto_profil %}
                    <img src="{{ profile.foto_profil.url }}" class="w-16 h-16 rounded-full object-cover border-2 border-yellow-500">
                {% else %}
                    <div class="w-16 h-16 rounded-full bg-yellow-500/20 flex items-center justify-center text-yellow-500 font-bold text-xl">
                        {{ request.user.username|slice:":1"|upper }}
                    </div>
                {% endif %}
                <div>
                    <label class="block text-gray-300 mb-1">Ganti Foto Profil Admin</label>
                    <input type="file" name="foto_profil" class="text-xs text-gray-400">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-400 mb-1">Username Superuser</label>
                    <input type="text" name="username" value="{{ request.user.username }}" class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">Nama Tampilan</label>
                    <input type="text" name="nama_lengkap" value="{{ request.user.first_name }}" class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-400 mb-1">Email Admin</label>
                    <input type="email" name="email" value="{{ request.user.email }}" class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">No. Kontak Marketing/Admin</label>
                    <input type="text" name="no_telepon" value="{{ profile.no_telepon|default:'' }}" class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700">
                </div>
            </div>
            <div>
                <label class="block text-gray-400 mb-1">Ganti Password Baru (Kosongkan jika tidak ingin mengganti)</label>
                <input type="password" name="password_baru" placeholder="••••••••" class="w-full p-2.5 rounded bg-[#2a2a2a] border border-gray-700">
            </div>

            <button type="submit" class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded mt-4">
                SIMPAN PERUBAHAN ADMIN
            </button>
        </form>
    </div>
</body>
</html>
